[project]
name = "meeting-intelligence"
version = "0.1.0"
description = "AI Meeting Intelligence - Extracts structured insights from meeting transcripts"
requires-python = ">=3.12"
dependencies = [
    "langchain==0.3.25",
    "langchain-openai==0.3.12",
    "langgraph==0.4.1",
    "pydantic==2.11.3",
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "python-dotenv==1.1.0",
    "pydantic-settings==2.8.1",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "httpx==0.28.1",
]
gemini = [
    "langchain-google-genai==2.1.2",
]
transcription = [
    "faster-whisper==1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
